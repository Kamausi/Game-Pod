[project]
name = "tradebot"
version = "0.1.0"
description = "Paper-first multi-asset trading agent: deterministic state engine, typed LLM decisions, hard-coded risk layer, gated live trading with canary caps."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.70"]
services = ["grpcio>=1.66", "protobuf>=5.27"]
stream = ["websockets>=12"]
solana = ["solders>=0.21", "base58>=2.1"]
all = ["anthropic>=0.70", "grpcio>=1.66", "protobuf>=5.27", "websockets>=12", "solders>=0.21", "base58>=2.1"]

[project.scripts]
tradebot = "tradebot.cli:entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
