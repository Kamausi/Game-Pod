<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Haunted Harvest</title>
<style>
  :root { --bg:#0d0718; --ink:#f4e9ff; --accent:#ff7a1a; --muted:#b9a3d9; --panel:rgba(13,7,24,.86); }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Trebuchet MS", system-ui, sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  canvas { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:12px 16px 0; font-weight:700; font-size:18px; pointer-events:none; text-shadow:0 2px 6px #000; }
  #curse { position:fixed; top:48px; left:0; right:0; text-align:center; pointer-events:none;
    color:var(--accent); font-weight:700; font-size:15px; text-shadow:0 2px 6px #000; }
  #banner { position:fixed; top:38%; left:16px; right:16px; text-align:center; pointer-events:none;
    opacity:0; transition:opacity .4s; text-shadow:0 3px 12px #000; }
  #banner.show { opacity:1; }
  #banner h2 { margin:0; font-size:clamp(28px,7vw,48px); color:var(--accent); }
  #banner p { margin:6px 0 0; font-size:clamp(15px,4vw,20px); }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--panel); padding:16px; text-align:center; }
  #overlay.hidden { display:none; }
  .card { max-width:440px; }
  .card h1 { font-size:clamp(34px,9vw,56px); margin:0 0 8px; color:var(--accent);
    text-shadow:0 0 18px rgba(255,122,26,.6); }
  .card p { color:var(--muted); line-height:1.5; margin:8px 0; }
  .card ul { text-align:left; color:var(--ink); line-height:1.7; padding-left:20px; margin:14px auto; max-width:340px; }
  button { margin-top:14px; font:inherit; font-size:20px; font-weight:700; color:#1a0d00;
    background:var(--accent); border:0; border-radius:999px; padding:12px 34px; cursor:pointer;
    box-shadow:0 0 24px rgba(255,122,26,.5); }
  button:hover { filter:brightness(1.1); }
  .small { font-size:13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">🍬 0</span><span id="wave">Wave 1</span><span id="lives">❤️❤️❤️</span></div>
<div id="curse"></div>
<div id="banner"><h2 id="bTitle"></h2><p id="bDesc"></p></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, stars = [], graves = [];

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: Math.round(W * H / 6000) }, () =>
    ({ x: Math.random() * W, y: Math.random() * H * 0.7, r: Math.random() * 1.5 + 0.3, p: Math.random() * 6 }));
  graves = Array.from({ length: Math.ceil(W / 110) }, (_, i) =>
    ({ x: i * 110 + Math.random() * 60, w: 26 + Math.random() * 18, h: 34 + Math.random() * 26, cross: Math.random() < 0.3 }));
}
addEventListener('resize', resize);
resize();

// ---------- Random curses: one is rolled every wave ----------
const CURSES = [
  { id: 'none',    name: 'A Quiet Night',   desc: 'Nothing strange… yet.' },
  { id: 'fog',     name: 'Fog of Dread',    desc: 'You can barely see a thing.' },
  { id: 'reverse', name: 'Backwards Broom', desc: 'Your controls are reversed!' },
  { id: 'bats',    name: 'Bat Swarm',       desc: 'The bats are restless tonight.' },
  { id: 'sugar',   name: 'Sugar Rush',      desc: 'Candy is worth double and you zoom.' },
  { id: 'giant',   name: 'Giant Ghosts',    desc: 'The ghosts grew. A lot.' },
  { id: 'moon',    name: 'Blood Moon',      desc: 'Everything moves faster.' },
  { id: 'rain',    name: 'Candy Rain',      desc: 'Treats are falling from the sky!' },
  { id: 'phantom', name: 'Phantom Flicker', desc: 'Ghosts fade in and out of sight.' },
];
const CANDY = ['🍬', '🍭', '🍫', '🍬', '🍭'];
const WAVE_LEN = 20;

// ---------- Tiny sound effects ----------
let actx = null, muted = false;
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

let best = 0;
try { best = +localStorage.getItem('hh-best') || 0; } catch (e) {}

// ---------- Game state ----------
let mode = 'menu', S = null, shake = 0;

function newGame() {
  S = { score: 0, lives: 3, wave: 0, waveT: 0, t: 0, scared: 0, curse: CURSES[0],
    p: { x: W / 2, y: H / 2, r: 18, inv: 0, face: 1 },
    candies: [], ghosts: [], bats: [], pumpkins: [], parts: [], floats: [],
    cd: { candy: 0, ghost: 2, bat: 5, pump: 10 } };
  nextWave();
}

function nextWave() {
  S.wave++;
  S.waveT = WAVE_LEN;
  if (S.wave > 1) { addScore(100, S.p.x, S.p.y - 30, '#ffd36b', 'WAVE BONUS +100'); beep(520, 0.3, 'triangle', 0.06, 400); }
  const pool = S.wave === 1 ? [CURSES[0]] : CURSES.filter(c => c !== S.curse);
  S.curse = pool[Math.random() * pool.length | 0];
  $('bTitle').textContent = S.wave === 1 ? 'Haunted Harvest' : `Wave ${S.wave}: ${S.curse.name}`;
  $('bDesc').textContent = S.wave === 1 ? 'Grab the candy. Dodge the dead.' : S.curse.desc;
  $('banner').classList.add('show');
  setTimeout(() => $('banner').classList.remove('show'), 2200);
}

const is = id => S.curse.id === id;
const speedMul = () => (is('moon') ? 1.5 : 1) * (1 + (S.wave - 1) * 0.07);

function addScore(n, x, y, color = '#fff', label) {
  S.score += n;
  S.floats.push({ x, y, text: label || `+${n}`, color, life: 1 });
}

function burst(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
    S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.4, color });
  }
}

function edgeSpawn(minDist) {
  for (let i = 0; i < 20; i++) {
    const side = Math.random() * 4 | 0;
    const x = side === 0 ? -40 : side === 1 ? W + 40 : Math.random() * W;
    const y = side === 2 ? -40 : side === 3 ? H + 40 : Math.random() * H;
    if (Math.hypot(x - S.p.x, y - S.p.y) > minDist) return { x, y };
  }
  return { x: -40, y: -40 };
}

function spawn(dt) {
  const cd = S.cd;
  for (const k in cd) cd[k] -= dt;

  if (cd.candy <= 0) {
    if (is('rain')) {
      S.candies.push({ x: 20 + Math.random() * (W - 40), y: -20, vy: 90 + Math.random() * 80, e: CANDY[Math.random() * 5 | 0], ttl: 99 });
      cd.candy = 0.18;
    } else {
      S.candies.push({ x: 30 + Math.random() * (W - 60), y: 80 + Math.random() * (H - 160), vy: 0, e: CANDY[Math.random() * 5 | 0], ttl: 7 });
      cd.candy = 0.8;
    }
  }
  if (cd.ghost <= 0 && S.ghosts.length < 3 + S.wave) {
    const pos = edgeSpawn(200);
    S.ghosts.push({ ...pos, ph: Math.random() * 6, spd: 55 + Math.random() * 30 + S.wave * 6 });
    cd.ghost = Math.max(1.2, 4 - S.wave * 0.3);
  }
  if (cd.bat <= 0) {
    const left = Math.random() < 0.5;
    S.bats.push({ x: left ? -30 : W + 30, y0: 60 + Math.random() * (H - 120), vx: (left ? 1 : -1) * (140 + Math.random() * 90),
      amp: 20 + Math.random() * 50, ph: Math.random() * 6 });
    cd.bat = is('bats') ? 0.45 : Math.max(1.4, 4 - S.wave * 0.25);
  }
  if (cd.pump <= 0) {
    S.pumpkins.push({ x: 40 + Math.random() * (W - 80), y: 90 + Math.random() * (H - 180), ttl: 7 });
    cd.pump = 12 + Math.random() * 8;
  }
}

// ---------- Input ----------
const keys = {};
let pointer = null;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'm') muted = !muted;
  if ((k === 'p' || k === 'escape') && (mode === 'play' || mode === 'pause')) togglePause();
  else if ((k === ' ' || k === 'enter') && mode !== 'play') { e.preventDefault(); start(); }
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function setPointer(e) {
  // On touch, steer slightly above the finger so you can see the witch
  pointer = { x: e.clientX, y: e.clientY - (e.pointerType === 'touch' ? 60 : 0) };
}
cv.addEventListener('pointermove', setPointer);
cv.addEventListener('pointerdown', setPointer);
addEventListener('blur', () => { if (mode === 'play') togglePause(); });

// ---------- Update ----------
const hitTest = (a, b, ar, br) => Math.hypot(a.x - b.x, a.y - b.y) < ar + br;

function hurt() {
  const p = S.p;
  if (p.inv > 0) return;
  S.lives--; p.inv = 2; shake = 0.35;
  burst(p.x, p.y, '#ff4b6e', 18);
  beep(160, 0.35, 'sawtooth', 0.08, -100);
  if (S.lives <= 0) gameOver();
}

function update(dt) {
  S.t += dt;
  S.waveT -= dt;
  if (S.waveT <= 0) nextWave();
  S.scared = Math.max(0, S.scared - dt);
  shake = Math.max(0, shake - dt);
  const p = S.p, mul = speedMul(), rev = is('reverse');
  p.inv = Math.max(0, p.inv - dt);

  // Player movement
  const sp = is('sugar') ? 400 : 290;
  let dx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
  let dy = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
  if (dx || dy) {
    pointer = null;
    if (rev) { dx = -dx; dy = -dy; }
    const m = Math.hypot(dx, dy);
    p.x += dx / m * sp * dt; p.y += dy / m * sp * dt;
    if (dx) p.face = Math.sign(dx);
  } else if (pointer) {
    const tx = rev ? W - pointer.x : pointer.x, ty = rev ? H - pointer.y : pointer.y;
    const ddx = tx - p.x, ddy = ty - p.y, d = Math.hypot(ddx, ddy);
    if (d > 2) {
      const s = Math.min(d, sp * dt);
      p.x += ddx / d * s; p.y += ddy / d * s;
      if (Math.abs(ddx) > 4) p.face = Math.sign(ddx);
    }
  }
  p.x = Math.max(p.r, Math.min(W - p.r, p.x));
  p.y = Math.max(p.r + 40, Math.min(H - p.r, p.y));

  spawn(dt);

  // Candy
  for (const c of S.candies) {
    c.y += c.vy * dt; c.ttl -= dt;
    if (hitTest(c, p, 16, p.r)) {
      c.ttl = -1;
      const n = is('sugar') ? 20 : 10;
      addScore(n, c.x, c.y, '#ffd36b');
      burst(c.x, c.y, '#ffd36b', 6);
      beep(880 + Math.random() * 200, 0.08, 'square', 0.03, 300);
    }
  }
  S.candies = S.candies.filter(c => c.ttl > 0 && c.y < H + 30);

  // Pumpkins (power-up)
  for (const k of S.pumpkins) {
    k.ttl -= dt;
    if (hitTest(k, p, 20, p.r)) {
      k.ttl = -1; S.scared = 6;
      addScore(25, k.x, k.y, '#ff9a3c', 'SPOOK THE SPOOKS!');
      burst(k.x, k.y, '#ff9a3c', 20);
      beep(300, 0.5, 'triangle', 0.07, 600);
    }
  }
  S.pumpkins = S.pumpkins.filter(k => k.ttl > 0);

  // Ghosts chase you (or flee while you hold pumpkin power)
  const gr = is('giant') ? 40 : 20;
  for (const g of S.ghosts) {
    g.ph += dt * 3;
    const ddx = p.x - g.x, ddy = p.y - g.y, d = Math.hypot(ddx, ddy) || 1;
    const dir = S.scared > 0 ? -0.6 : 1;
    g.x += ddx / d * g.spd * mul * dir * dt;
    g.y += ddy / d * g.spd * mul * dir * dt + Math.sin(g.ph) * 12 * dt;
    if (S.scared > 0) { g.x = Math.max(gr, Math.min(W - gr, g.x)); g.y = Math.max(gr, Math.min(H - gr, g.y)); }
    if (hitTest(g, p, gr * 0.8, p.r * 0.8)) {
      if (S.scared > 0) {
        g.dead = true;
        addScore(50, g.x, g.y, '#8fd3ff', 'BOO! +50');
        burst(g.x, g.y, '#cfe9ff', 16);
        beep(700, 0.25, 'sine', 0.07, -500);
      } else hurt();
    }
  }
  S.ghosts = S.ghosts.filter(g => !g.dead);

  // Bats swoop across
  for (const b of S.bats) {
    b.x += b.vx * mul * dt; b.ph += dt * 4;
    b.y = b.y0 + Math.sin(b.ph) * b.amp;
    if (hitTest(b, p, 14, p.r * 0.8)) hurt();
  }
  S.bats = S.bats.filter(b => b.x > -60 && b.x < W + 60);

  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 200 * dt; q.life -= dt; }
  S.parts = S.parts.filter(q => q.life > 0);
  for (const f of S.floats) { f.y -= 40 * dt; f.life -= dt; }
  S.floats = S.floats.filter(f => f.life > 0);
}

// ---------- Drawing ----------
function drawBackground(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  const blood = S && is('moon');
  sky.addColorStop(0, blood ? '#2a0610' : '#120827');
  sky.addColorStop(1, blood ? '#4a0d1a' : '#2b1450');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.8 + s.p));
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const mx = W * 0.8, my = H * 0.18, mr = Math.min(W, H) * 0.08 + 20;
  const glow = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 3);
  glow.addColorStop(0, blood ? 'rgba(255,60,60,.35)' : 'rgba(255,240,200,.25)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = blood ? '#ff4040' : '#fff3c4';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();

  // Hills and graveyard silhouettes
  ctx.fillStyle = '#0a0414';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 50 - Math.sin(x / 140) * 18);
  ctx.lineTo(W, H); ctx.fill();
  for (const g of graves) {
    const gy = H - 50 - Math.sin(g.x / 140) * 18;
    if (g.cross) {
      ctx.fillRect(g.x + g.w / 2 - 4, gy - g.h - 8, 8, g.h + 8);
      ctx.fillRect(g.x + 2, gy - g.h + 4, g.w - 4, 7);
    } else {
      ctx.beginPath();
      ctx.moveTo(g.x, gy); ctx.lineTo(g.x, gy - g.h + g.w / 2);
      ctx.arc(g.x + g.w / 2, gy - g.h + g.w / 2, g.w / 2, Math.PI, 0);
      ctx.lineTo(g.x + g.w, gy); ctx.fill();
    }
  }
}

function emoji(e, x, y, size, flip = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(flip, 1);
  ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, 0, 0);
  ctx.restore();
}

function drawGhost(g, r) {
  const scared = S.scared > 0, ending = scared && S.scared < 1.5 && Math.sin(S.t * 20) > 0;
  let alpha = 0.92;
  if (is('phantom')) alpha = 0.08 + 0.85 * Math.max(0, Math.sin(S.t * 1.7 + g.ph * 0.3));
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(g.x, g.y);
  ctx.fillStyle = scared && !ending ? '#4f7dff' : '#f2f0ff';
  ctx.shadowColor = scared ? '#4f7dff' : '#d9ccff'; ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(0, -r * 0.2, r, Math.PI, 0);
  ctx.lineTo(r, r * 0.9);
  for (let i = 0; i <= 4; i++) {
    const x = r - (i * 2 * r) / 4, w = Math.sin(S.t * 6 + i + g.ph) * r * 0.12;
    ctx.lineTo(x, r * (i % 2 ? 0.65 : 0.9) + w);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = scared ? '#fff' : '#1a0b2e';
  const look = scared ? 0 : Math.sign(S.p.x - g.x) * r * 0.08;
  ctx.beginPath(); ctx.ellipse(-r * 0.35 + look, -r * 0.25, r * 0.15, r * 0.22, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.35 + look, -r * 0.25, r * 0.15, r * 0.22, 0, 0, 7); ctx.fill();
  if (scared) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 6; i++) ctx.lineTo(-r * 0.45 + i * r * 0.15, r * 0.25 + (i % 2 ? -3 : 3));
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 0.18, r * 0.24, 0, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawGame() {
  const p = S.p;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake / 0.35, (Math.random() - 0.5) * 14 * shake / 0.35);

  for (const k of S.pumpkins) {
    if (k.ttl < 2 && Math.sin(S.t * 18) > 0) continue;
    const bob = Math.sin(S.t * 3 + k.x) * 4;
    const gl = ctx.createRadialGradient(k.x, k.y, 4, k.x, k.y, 40);
    gl.addColorStop(0, 'rgba(255,140,30,.5)'); gl.addColorStop(1, 'rgba(255,140,30,0)');
    ctx.fillStyle = gl; ctx.fillRect(k.x - 40, k.y - 40, 80, 80);
    emoji('🎃', k.x, k.y + bob, 38);
  }
  for (const c of S.candies) {
    if (c.ttl < 2 && Math.sin(S.t * 18) > 0) continue;
    emoji(c.e, c.x, c.y + Math.sin(S.t * 4 + c.x) * 3, 28);
  }
  const gr = is('giant') ? 40 : 20;
  for (const g of S.ghosts) drawGhost(g, gr);
  for (const b of S.bats) emoji('🦇', b.x, b.y, 30, b.vx > 0 ? -1 : 1);

  // Player
  if (!(p.inv > 0 && Math.sin(S.t * 30) > 0)) {
    if (S.scared > 0) {
      ctx.strokeStyle = `rgba(255,140,30,${0.4 + 0.3 * Math.sin(S.t * 10)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 10, 0, 7); ctx.stroke();
    }
    emoji('🧹', p.x - p.face * 2, p.y + 14, 30, -p.face);
    emoji('🧙', p.x, p.y - 4, 38, -p.face);
  }

  for (const q of S.parts) {
    ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.color;
    ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 16px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  for (const f of S.floats) {
    ctx.globalAlpha = Math.max(0, f.life); ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (is('fog')) {
    const fog = ctx.createRadialGradient(p.x, p.y, 70, p.x, p.y, 190);
    fog.addColorStop(0, 'rgba(8,4,16,0)'); fog.addColorStop(1, 'rgba(8,4,16,.97)');
    ctx.fillStyle = fog; ctx.fillRect(0, 0, W, H);
  }

  // Wave timer bar
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 5);
  ctx.fillStyle = '#ff7a1a'; ctx.fillRect(0, 0, W * (S.waveT / WAVE_LEN), 5);
  if (S.scared > 0) { ctx.fillStyle = '#4f7dff'; ctx.fillRect(0, 5, W * (S.scared / 6), 4); }

  $('score').textContent = `🍬 ${S.score}`;
  $('wave').textContent = `Wave ${S.wave}`;
  $('lives').textContent = '❤️'.repeat(Math.max(0, S.lives)) + '🖤'.repeat(Math.max(0, 3 - S.lives));
  $('curse').textContent = S.wave > 1 ? `☠ ${S.curse.name}` : '';
}

// ---------- Screens ----------
function showOverlay(html) { $('card').innerHTML = html; $('overlay').classList.remove('hidden'); }

function menu() {
  showOverlay(`<h1>🎃 Haunted Harvest</h1>
    <p>Fly your broom through the graveyard and grab every treat before the restless dead grab you.</p>
    <ul>
      <li>🍬 Candy = points</li>
      <li>👻 Ghosts chase you · 🦇 bats swoop past</li>
      <li>🎃 Pumpkins scare ghosts. Fly into them for +50</li>
      <li>🎲 Every wave rolls a <b>random curse</b></li>
    </ul>
    <p class="small">Move with mouse/touch or arrows/WASD · P pause · M mute</p>
    ${best ? `<p>Best: <b>${best}</b></p>` : ''}
    <button id="go">Start haunting</button>`);
  $('go').onclick = start;
}

function start() {
  $('overlay').classList.add('hidden');
  if (mode !== 'pause') newGame();
  mode = 'play';
  beep(200, 0.2, 'triangle', 0.05, 200);
}

function togglePause() {
  if (mode === 'play') {
    mode = 'pause';
    showOverlay(`<h1>Paused</h1><p>The ghosts are waiting…</p><button id="go">Resume</button>`);
    $('go').onclick = start;
  } else if (mode === 'pause') start();
}

const EPITAPHS = [
  'Here lies a witch who loved candy a little too much.',
  'Spooked to death. Rest in pieces.',
  'The ghosts say thanks for the snacks.',
  'Your broom has been repossessed by the undead.',
  'You have joined the haunting. Welcome aboard.',
];

function gameOver() {
  mode = 'over';
  const isBest = S.score > best;
  if (isBest) { best = S.score; try { localStorage.setItem('hh-best', best); } catch (e) {} }
  setTimeout(() => {
    showOverlay(`<h1>🪦 R.I.P.</h1>
      <p>${EPITAPHS[Math.random() * EPITAPHS.length | 0]}</p>
      <p style="font-size:22px;color:var(--ink)">Score <b>${S.score}</b> · Wave <b>${S.wave}</b></p>
      <p>${isBest ? '🏆 New best score!' : `Best: ${best}`}</p>
      <button id="go">Rise again</button>`);
    $('go').onclick = start;
  }, 700);
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (mode === 'play') update(dt);
  else if (mode === 'over' && S) {
    for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 200 * dt; q.life -= dt; }
  }
  drawBackground(now / 1000);
  if (S) drawGame();
  requestAnimationFrame(frame);
}
menu();
requestAnimationFrame(frame);
</script>
</body>
</html>
