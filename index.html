<title>Comet Hop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Chakra+Petch:wght@500;700&display=swap">
<style>
  /* Layout: one full-bleed canvas; the world is a 420-unit-wide column scaled to fit, HUD drawn in-canvas. */
  :root {
    --space: #050f14;
    --ink: #f4efe1;
    --gold: #ffcf4a;
    --coral: #ff6b5b;
    --mint: #5ff2c4;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-data: "Chakra Petch", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--space);
    color: var(--ink);
    overflow: hidden;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: pointer;
    outline: none;
  }
  #mute {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: calc(12px + env(safe-area-inset-left, 0px));
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(244, 239, 225, .25);
    background: rgba(5, 15, 20, .5);
    color: var(--ink);
    font: 18px var(--font-data);
    cursor: pointer;
    z-index: 2;
  }
  #mute:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

<canvas id="c" tabindex="0" aria-label="Comet Hop game. Tap, click or press space to launch."></canvas>
<button id="mute" type="button" aria-label="Toggle sound">♪</button>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const muteBtn = document.getElementById('mute');
  const CSSV = getComputedStyle(document.documentElement);
  const FD = CSSV.getPropertyValue('--font-display').trim();
  const FN = CSSV.getPropertyValue('--font-data').trim();
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('comethop.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('comethop.' + k, JSON.stringify(v)); } catch {} }
  };
  let best = store.get('best', 0);
  let dust = store.get('dust', 0);
  let runs = store.get('runs', 0);
  let muted = store.get('muted', false);

  // Comets unlock automatically as lifetime stardust grows.
  const SKINS = [
    { name: 'Ember',        at: 0,    head: '#fff4d6', trail: ['#ffcf4a', '#ff6b5b'] },
    { name: 'Glacier',      at: 40,   head: '#e9fbff', trail: ['#8fe9ff', '#3a8dff'] },
    { name: 'Venom',        at: 100,  head: '#f1ffe8', trail: ['#b6ff5c', '#1fd17a'] },
    { name: 'Nebula Rose',  at: 180,  head: '#fff0f7', trail: ['#ff8fd1', '#b04dff'] },
    { name: 'Solar Flare',  at: 300,  head: '#ffffff', trail: ['#ffe14a', '#ff3d00'] },
    { name: 'Aurora',       at: 450,  head: '#f2fff9', trail: ['#5ff2c4', '#9d6bff'] },
    { name: 'Void Walker',  at: 650,  head: '#ffffff', trail: ['#9d8cff', '#2b1a73'] },
    { name: 'Gold Rush',    at: 900,  head: '#fffbe6', trail: ['#ffe680', '#c98a00'] },
    { name: 'Blood Moon',   at: 1200, head: '#ffe6e0', trail: ['#ff4a3d', '#5c0a12'] },
    { name: 'Prism',        at: 1600, head: '#ffffff', trail: 'rainbow' },
  ];
  const skinIndexFor = d => { let i = 0; SKINS.forEach((s, j) => { if (d >= s.at) i = j; }); return i; };
  let skinIdx = Math.min(store.get('skin', 99), skinIndexFor(dust));
  const equip = i => { skinIdx = i; store.set('skin', i); };

  // ---------- missions ----------
  // Every mission is "in one run". Finishing one pays stardust and levels that mission type up.
  const MISSION_TYPES = {
    score:    { desc: n => `Score ${n} in one run`,        target: l => 20 + 15 * l, stat: 'score' },
    chain:    { desc: n => `Chain ${n} perfects in a row`, target: l => 3 + l,       stat: 'maxChain' },
    dust:     { desc: n => `Collect ${n} stardust`,        target: l => 15 + 12 * l, stat: 'dust' },
    perfects: { desc: n => `Land ${n} perfects`,           target: l => 5 + 4 * l,   stat: 'perfects' },
    power:    { desc: n => `Grab ${n} power-up${n > 1 ? 's' : ''}`, target: l => 1 + l, stat: 'power' },
    moving:   { desc: n => `Land on ${n} moving planets`,  target: l => 3 + 2 * l,   stat: 'moving' },
    golden:   { desc: n => `Land on ${n} golden planet${n > 1 ? 's' : ''}`, target: l => 1 + Math.floor(l / 2), stat: 'golden' },
    nova:     { desc: n => `Go Supernova ${n} time${n > 1 ? 's' : ''}`, target: l => 1 + Math.floor(l / 2), stat: 'novas' },
    hops:     { desc: n => `Hop ${n} planets`,             target: l => 12 + 8 * l,  stat: 'hops' },
    close:    { desc: n => `Pull off ${n} close call${n > 1 ? 's' : ''}`, target: l => 1 + l, stat: 'close' },
    sector:   { desc: n => `Reach sector ${n}`,            target: l => 2 + Math.floor(l / 2), stat: 'sector' },
  };

  // ---------- ranks ----------
  // XP from every run raises your pilot rank; each rank switches on a permanent perk.
  const RANKS = [
    { name: 'Cadet',     at: 0,    perk: 'Your journey begins' },
    { name: 'Pilot',     at: 150,  perk: '+10% stardust every run' },
    { name: 'Navigator', at: 400,  perk: 'Power-ups last 30% longer' },
    { name: 'Ace',       at: 800,  perk: 'Start every run with a Shield' },
    { name: 'Captain',   at: 1400, perk: 'Bigger magnet, more golden planets' },
    { name: 'Commander', at: 2200, perk: '+25% stardust every run' },
    { name: 'Admiral',   at: 3300, perk: 'Start every run with a Magnet too' },
    { name: 'Star Lord', at: 4800, perk: 'Supernova lasts 10 seconds' },
  ];
  let xp = store.get('xp', 0);
  const rankFor = x => { let i = 0; RANKS.forEach((r, j) => { if (x >= r.at) i = j; }); return i; };
  let rank = rankFor(xp);
  const perk = {
    dust: () => rank >= 5 ? 0.25 : rank >= 1 ? 0.1 : 0,
    dur: () => rank >= 2 ? 1.3 : 1,
    shield: () => rank >= 3,
    magnetR: () => rank >= 4 ? 210 : 150,
    golden: () => rank >= 4 ? 0.12 : 0.08,
    magnet: () => rank >= 6,
    nova: () => rank >= 7 ? 10 : 7,
  };

  // ---------- crates & best-run marker ----------
  const CRATE_AT = 60;
  let crateP = store.get('crate', 0);
  let bestIdx = store.get('bestIdx', 0);
  const CRATE_TIERS = [
    { name: 'COMMON',    chance: 0.60, dust: 25,  color: '#bfe9ff' },
    { name: 'RARE',      chance: 0.28, dust: 60,  color: '#5ff2c4' },
    { name: 'EPIC',      chance: 0.10, dust: 150, color: '#c3a6ff' },
    { name: 'LEGENDARY', chance: 0.02, dust: 400, color: '#ffcf4a' },
  ];

  // ---------- sector events ----------
  const MODS = {
    meteor:  { name: 'METEOR FIELD',   sub: 'dodge the rocks while you fly',   color: '#ff8a5b' },
    storm:   { name: 'STARDUST STORM', sub: 'the sky is full of stardust',     color: '#bfe9ff' },
    hyper:   { name: 'HYPERDRIVE',     sub: 'faster orbits, +1 point per hop', color: '#ff7aa8' },
    gravity: { name: 'GRAVITY WELLS',  sub: 'black holes bend your path',      color: '#c3a6ff' },
    gold:    { name: 'GOLD RUSH',      sub: 'golden planets everywhere',       color: '#ffcf4a' },
  };
  let mLevels = store.get('mlevels', {});
  let missions = store.get('missions', null);
  function newMission(exclude) {
    const types = Object.keys(MISSION_TYPES).filter(t => !exclude.includes(t));
    const type = pick(types);
    const lvl = mLevels[type] || 0;
    return { type, lvl, target: MISSION_TYPES[type].target(lvl) };
  }
  if (!Array.isArray(missions) || missions.length !== 3 || missions.some(m => !MISSION_TYPES[m.type])) {
    missions = [];
    for (let i = 0; i < 3; i++) missions.push(newMission(missions.map(m => m.type)));
    store.set('missions', missions);
  }
  const missionReward = m => 15 + 10 * m.lvl;
  const missionDesc = m => MISSION_TYPES[m.type].desc(m.target);

  // ---------- daily gift ----------
  let gift = null;
  (() => {
    const today = new Date(); const key = today.toISOString().slice(0, 10);
    const last = store.get('lastDay', null);
    if (last === key) return;
    const y = new Date(today); y.setDate(y.getDate() - 1);
    let streak = last === y.toISOString().slice(0, 10) ? store.get('streak', 0) + 1 : 1;
    const amount = 20 + 10 * Math.min(streak - 1, 6);
    const had = skinIndexFor(dust);
    dust += amount;
    if (skinIndexFor(dust) > had) equip(skinIndexFor(dust));
    store.set('dust', dust); store.set('lastDay', key); store.set('streak', streak);
    gift = { amount, streak };
  })();

  // ---------- audio ----------
  let ac = null, master = null, noiseBuf = null;
  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0, at = 0) {
    if (muted || !ac) return;
    const t = at || ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol = 0.1, freq = 1200, at = 0, type = 'bandpass') {
    if (muted || !ac) return;
    const t = at || ac.currentTime;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.buffer = noiseBuf; s.connect(f).connect(g).connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  const PENTA = [0, 2, 4, 7, 9];
  const note = i => 392 * Math.pow(2, (PENTA[i % 5] + 12 * Math.floor(i / 5)) / 12);
  const sfx = {
    launch() { noise(0.18, 0.12, 900); tone(220, 0.15, 'triangle', 0.06, 220); },
    land(combo, perfect) {
      const i = Math.min(combo, 12);
      tone(note(i), 0.18, 'triangle', 0.14);
      if (perfect) { tone(note(i + 2), 0.22, 'sine', 0.1, 0, 0.06); tone(note(i + 4), 0.3, 'sine', 0.08, 0, 0.12); }
    },
    star(gold) { tone(gold ? 1320 : 1760, 0.12, 'sine', 0.08); tone(gold ? 1760 : 2350, 0.16, 'sine', 0.06, 0, 0.05); },
    power() { [0, 5, 9, 14].forEach((n, k) => tone(440 * Math.pow(2, n / 12), 0.2, 'square', 0.05, 0, k * 0.05)); },
    shield() { tone(300, 0.5, 'sine', 0.15, 600); noise(0.3, 0.1, 2000); },
    jackpot() { [0, 4, 7, 12, 16, 19, 24].forEach((n, k) => tone(523 * Math.pow(2, n / 12), 0.25, 'triangle', 0.08, 0, k * 0.05)); },
    nova() { tone(110, 1.2, 'sawtooth', 0.08, 880); noise(0.8, 0.12, 600, 0, 'lowpass'); [0, 7, 12, 19, 24].forEach((n, k) => tone(330 * Math.pow(2, n / 12), 0.4, 'sine', 0.07, 0, 0.2 + k * 0.06)); },
    die() { tone(180, 0.6, 'sawtooth', 0.09, -140); noise(0.4, 0.15, 300); },
    best() { [0, 2, 4, 7].forEach((n, k) => tone(523 * Math.pow(2, n / 12), 0.3, 'triangle', 0.1, 0, k * 0.09)); },
    unlock() { [0, 4, 7, 12, 16].forEach((n, k) => tone(659 * Math.pow(2, n / 12), 0.35, 'sine', 0.09, 0, k * 0.07)); },
    mission() { [0, 7, 12].forEach((n, k) => tone(784 * Math.pow(2, n / 12), 0.25, 'triangle', 0.09, 0, k * 0.08)); },
    sector() { tone(330, 0.5, 'sine', 0.08, 330); }
  };

  // Background music: a four-chord loop (Am F C G) that speeds up with score and gets busier in Supernova.
  const music = { next: 0, step: 0 };
  const PROG = [{ r: 0, c: [0, 3, 7, 12] }, { r: 8, c: [0, 4, 7, 12] }, { r: 3, c: [0, 4, 7, 12] }, { r: 10, c: [0, 4, 7, 12] }];
  function musicTick() {
    if (!ac || muted || ac.state !== 'running') return;
    const bpm = state === 'play' ? 108 + Math.min(score, 80) * 0.35 : 84;
    const spb = 60 / bpm / 2;
    if (music.next < ac.currentTime) music.next = ac.currentTime + 0.05;
    while (music.next < ac.currentTime + 0.15) {
      const t = music.next, s = music.step;
      const ch = PROG[Math.floor(s / 8) % 4];
      const root = 55 * Math.pow(2, ch.r / 12);
      const playing = state === 'play';
      if (s % 4 === 0) tone(root * 2, spb * 3, 'triangle', playing ? 0.06 : 0.04, 0, 0, t);
      if (playing || s % 2 === 0) {
        const n = ch.c[[0, 1, 2, 3, 2, 1, 2, 3][s % 8]];
        tone(root * 4 * Math.pow(2, n / 12), spb * 1.5, 'sine', playing ? 0.028 : 0.018, 0, 0, t);
      }
      if (playing && s % 8 === 4) noise(0.12, 0.05, 1800, t);
      if (playing && hops > 0 && s % 2 === 0) noise(0.03, 0.015, 9000, t, 'highpass');
      if (novaT > 0 && playing) {
        tone(root * 8 * Math.pow(2, ch.c[(s * 3) % 4] / 12), spb, 'square', 0.015, 0, 0, t);
        if (s % 4 === 0) noise(0.15, 0.08, 120, t, 'lowpass');
      }
      music.next += spb; music.step++;
    }
  }
  function setMuted(m) {
    muted = m; store.set('muted', m);
    muteBtn.textContent = m ? '×' : '♪'; muteBtn.style.opacity = m ? .5 : 1;
    if (master) master.gain.value = m ? 0 : 1;
  }
  setMuted(muted);
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', e => { e.stopPropagation(); audio(); setMuted(!muted); cv.focus(); });

  // ---------- layout ----------
  const W = 420;
  let DPR = 1, scale = 1, offX = 0, H = 760, CW = 0, CH = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    CW = cv.clientWidth; CH = cv.clientHeight;
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    scale = Math.min(CW / W, CH / 640);
    offX = (CW - W * scale) / 2;
    H = CH / scale;
  }
  window.addEventListener('resize', resize);
  resize();

  const PLANET_PALETTES = [
    ['#ff8a5b', '#b8341f'], ['#ffd25e', '#c9781a'], ['#5ff2c4', '#13806b'],
    ['#7fb8ff', '#2a4fb8'], ['#ff7aa8', '#9c2457'], ['#c3a6ff', '#5a37b0'],
    ['#9ae66e', '#3d8a24'], ['#ffb3e6', '#b0458f']
  ];
  const POWERS = {
    shield: { color: '#7fb8ff', label: 'SHIELD',  dur: 0 },
    magnet: { color: '#ff6b5b', label: 'MAGNET',  dur: 9 },
    double: { color: '#ffcf4a', label: '2X DUST', dur: 10 },
    slow:   { color: '#c3a6ff', label: 'SLOW-MO', dur: 6 },
  };

  // ---------- background ----------
  const bgStars = Array.from({ length: 140 }, () => ({
    x: Math.random(), y: Math.random(), p: rand(0.05, 0.45), r: rand(0.4, 1.6), tw: rand(0, 6.28)
  }));

  // ---------- game state ----------
  let state = 'title';           // title | play | dead
  let planets, stars, powers, particles, texts, banners, player, camY, score, combo, runDust, hops, shake, flash, deadAt, slowmo, sector, hintT, lastPlanet, newBest, unlockedNow, time = 0;
  let shield, magnetT, doubleT, slowT, novaT, run, missionDone, missionDust;
  let asteroids, holes, modifier, runIdx, rankBonus, xpGain, xpBefore, rankedUp, crate;
  let portals, shooters, shootT, milestoneI;
  const MILESTONES = [25, 50, 75, 100, 150, 200, 250, 300, 400, 500];

  function makePlanet(y, x, idx) {
    const d = clamp(idx / 45, 0, 1);
    const orbit = lerp(70, 46, d) + rand(-6, 6);
    const p = {
      x, baseX: x, y, orbit, body: orbit * rand(0.36, 0.46), pal: pick(PLANET_PALETTES), idx,
      ring: Math.random() < 0.3, ringTilt: rand(-0.5, 0.5),
      dir: Math.random() < 0.5 ? 1 : -1,
      lin: lerp(190, 300, d) + rand(-15, 15),
      amp: 0, mph: rand(0, 6.28), msp: 0, visited: false, pulse: 0, kind: 'normal',
      craters: Array.from({ length: 3 }, () => ({ a: rand(0, 6.28), r: rand(0.2, 0.6), s: rand(0.12, 0.22) }))
    };
    const roll = Math.random();
    if (idx > 4 && roll < (modifier === 'gold' ? 0.3 : perk.golden())) { p.kind = 'golden'; p.pal = ['#fff1a8', '#d99a00']; p.ring = true; }
    else if (idx > 2 && roll < 0.2) { p.kind = 'nebula'; }
    else if (idx > 8 && roll < 0.3) { p.kind = 'pulsar'; p.baseOrbit = p.orbit; p.pal = ['#eef9ff', '#4f8fe0']; p.ring = false; }
    else if (idx > 6 && Math.random() < 0.2 + 0.4 * d) {
      p.amp = rand(30, 50 + 50 * d);
      p.msp = rand(0.7, 1.2 + d);
      if (p.orbit * 2 + p.amp * 2 + 16 > W) p.amp = 0;
      else p.baseX = clamp(x, p.orbit + p.amp + 8, W - p.orbit - p.amp - 8);
    }
    return p;
  }

  function spawnNext() {
    const prev = planets[planets.length - 1];
    const idx = prev.idx + 1;
    const d = clamp(idx / 45, 0, 1);
    const gap = rand(165, 215) + d * 70;
    let x, tries = 0;
    do { x = rand(80, W - 80); tries++; } while (Math.abs(x - prev.baseX) < 50 && tries < 10);
    const p = makePlanet(prev.y - gap, x, idx);
    planets.push(p);
    if (p.kind === 'nebula') {
      // a ring of stardust sitting on the orbit itself
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        stars.push({ x: p.x + Math.cos(a) * p.orbit, y: p.y + Math.sin(a) * p.orbit, gold: false, ph: rand(0, 6.28), taken: false });
      }
    }
    decorateGap(prev, p, false);
  }

  // Fills the space between two planets. With modOnly, adds just the current sector event's extras.
  function decorateGap(prev, p, modOnly) {
    const idx = p.idx;
    const off = rand(-30, 30);
    if (!modOnly) {
      if (idx > 8 && Math.random() < 0.07) {
        portals.push({ x: lerp(prev.baseX, p.baseX, 0.5) + off, y: lerp(prev.y, p.y, 0.5), target: idx + 3, ph: rand(0, 6.28), used: false });
      } else if (idx > 3 && Math.random() < 0.16) {
        const type = pick(Object.keys(POWERS));
        powers.push({ type, x: lerp(prev.baseX, p.baseX, 0.5) + off, y: lerp(prev.y, p.y, 0.5), ph: rand(0, 6.28), taken: false });
      } else {
        const n = Math.random() < 0.35 ? 3 : Math.random() < 0.7 ? 2 : 1;
        const gold = idx > 3 && Math.random() < 0.15;
        for (let i = 0; i < n; i++) {
          const t = (i + 1) / (n + 1);
          stars.push({
            x: lerp(prev.baseX, p.baseX, t) + off, y: lerp(prev.y, p.y, t),
            gold: gold && i === Math.floor(n / 2), ph: rand(0, 6.28), taken: false
          });
        }
      }
    }
    if (modifier === 'storm') {
      for (let i = 0; i < 5; i++) {
        const t = rand(0.15, 0.85);
        stars.push({ x: clamp(lerp(prev.baseX, p.baseX, t) + rand(-70, 70), 16, W - 16), y: lerp(prev.y, p.y, t), gold: Math.random() < 0.2, ph: rand(0, 6.28), taken: false });
      }
    }
    if (idx > 2 && (modifier === 'meteor' || (!modOnly && idx > 15 && Math.random() < 0.12))) {
      const top = p.y + p.orbit + 16, bot = prev.y - prev.orbit - 16;
      const n = modifier === 'meteor' && Math.random() < 0.5 ? 2 : 1;
      if (bot - top > 8) for (let i = 0; i < n; i++) {
        const r = rand(11, 17);
        asteroids.push({
          x: rand(0, W), y: rand(top, bot), vx: (Math.random() < 0.5 ? -1 : 1) * rand(50, 110), r, rot: 0, vr: rand(-2, 2),
          pts: Array.from({ length: 8 }, () => rand(0.75, 1.1)), dead: false
        });
      }
    }
    if (modifier === 'gravity' && Math.random() < 0.75) {
      const mx = (prev.baseX + p.baseX) / 2, my = (prev.y + p.y) / 2;
      const hx = clamp(mx + (Math.random() < 0.5 ? -1 : 1) * rand(100, 140), 30, W - 30);
      if (Math.hypot(hx - prev.baseX, my - prev.y) > prev.orbit + 50 + prev.amp && Math.hypot(hx - p.baseX, my - p.y) > p.orbit + 50 + p.amp) {
        holes.push({ x: hx, y: my, ph: rand(0, 6.28) });
      }
    }
  }

  function startModifier() {
    const keys = Object.keys(MODS).filter(k => k !== modifier);
    modifier = pick(keys);
    const M = MODS[modifier];
    banners.push({ title: `SECTOR ${sector + 1} · ${M.name}`, sub: M.sub, color: M.color, t: 0 });
    // apply to gaps the player hasn't reached yet (skip the very next one so nothing pops in unfairly)
    for (let i = 1; i < planets.length; i++) {
      if (planets[i].idx >= player.planet.idx + 2 && planets[i - 1].idx === planets[i].idx - 1) decorateGap(planets[i - 1], planets[i], true);
    }
  }

  function reset() {
    planets = []; stars = []; powers = []; particles = []; texts = []; banners = []; asteroids = []; holes = [];
    portals = []; shooters = []; shootT = rand(10, 16); milestoneI = 0;
    score = 0; combo = 0; runDust = 0; hops = 0; shake = 0; flash = 0; slowmo = 1; sector = 0; hintT = 0;
    newBest = false; unlockedNow = null; modifier = null; runIdx = 0; crate = null; rankedUp = 0;
    shield = perk.shield(); magnetT = perk.magnet() ? 8 : 0; doubleT = 0; slowT = 0; novaT = 0;
    run = { score: 0, maxChain: 0, dust: 0, perfects: 0, power: 0, moving: 0, golden: 0, novas: 0, hops: 0, close: 0, sector: 1 };
    missionDone = [false, false, false]; missionDust = 0;
    const first = makePlanet(0, W / 2, 0);
    first.visited = true; first.kind = 'normal'; first.amp = 0;
    planets.push(first);
    for (let i = 0; i < 6; i++) spawnNext();
    player = { x: 0, y: 0, vx: 0, vy: 0, mode: 'orbit', planet: first, angle: Math.PI / 2, dir: 1, r: first.orbit, flyT: 0 };
    first.dir = 1;
    lastPlanet = first;
    camY = first.y - H * 0.7;
    placeOnOrbit();
  }

  function placeOnOrbit() {
    const p = player.planet;
    player.x = p.x + Math.cos(player.angle) * player.r;
    player.y = p.y + Math.sin(player.angle) * player.r;
  }

  function launch() {
    if (player.mode !== 'orbit') return;
    const sp = 560 + Math.min(hops, 40) * 3;
    const a = player.angle, d = player.dir;
    player.vx = -Math.sin(a) * d * sp;
    player.vy = Math.cos(a) * d * sp;
    player.mode = 'fly'; player.flyT = 0;
    lastPlanet = player.planet;
    burst(player.x, player.y, 10, skinColor(0.3), 120, 0.4);
    sfx.launch();
  }

  function checkMissions() {
    missions.forEach((m, i) => {
      if (missionDone[i]) return;
      if (run[MISSION_TYPES[m.type].stat] >= m.target) {
        missionDone[i] = true;
        missionDust += missionReward(m);
        banners.push({ title: 'MISSION COMPLETE', sub: `${missionDesc(m)}  ·  +${missionReward(m)} ✦`, color: '#5ff2c4', t: 0 });
        sfx.mission();
      }
    });
  }

  function capture(p) {
    const rx = player.x - p.x, ry = player.y - p.y;
    const cross = rx * player.vy - ry * player.vx;
    const v = Math.hypot(player.vx, player.vy);
    const impact = Math.abs(cross) / v;
    const perfect = impact < p.orbit * 0.42;
    player.mode = 'orbit'; player.planet = p;
    player.angle = Math.atan2(ry, rx);
    player.dir = cross >= 0 ? 1 : -1;
    p.dir = player.dir;
    player.r = Math.hypot(rx, ry);
    p.pulse = 1;

    if (!p.visited) {
      p.visited = true;
      hops++; run.hops = hops;
      runIdx = Math.max(runIdx, p.idx);
      if (runIdx === bestIdx + 1 && bestIdx > 3) addText(W / 2, camY + H * 0.52, 'UNCHARTED SPACE', '#5ff2c4', 30, true);
      if (player.flyT > 1.1 || player.x < 28 || player.x > W - 28) {
        run.close++;
        const v = addDust(3);
        addText(p.x, p.y + p.orbit + 22, `CLOSE CALL +${v} ✦`, '#ff8a5b', 22);
      }
      if (p.amp) run.moving++;
      if (perfect) { combo++; run.perfects++; run.maxChain = Math.max(run.maxChain, combo); } else combo = 0;
      const mult = 1 + Math.min(combo, 4);
      let gain = (perfect ? mult : 1) + (modifier === 'hyper' ? 1 : 0);
      if (perfect) {
        const words = ['PERFECT', 'GREAT', 'STELLAR', 'COSMIC', 'GODLIKE'];
        addText(p.x, p.y - p.orbit - 18, words[Math.min(combo - 1, 4)] + (mult > 1 ? '  x' + mult : ''), comboColor(), 26);
        shake = Math.max(shake, 6 + combo * 1.5);
        flash = 0.25;
        burst(player.x, player.y, 18 + combo * 4, comboColor(), 260, 0.7);
        ringWave(p);
      } else {
        addText(p.x, p.y - p.orbit - 18, '+1', '#f4efe1', 22);
        burst(player.x, player.y, 8, skinColor(0.5), 140, 0.5);
      }
      sfx.land(hops, perfect);
      if (p.kind === 'golden') {
        gain += 5; run.golden++;
        addDust(10);
        addText(p.x, p.y + p.orbit + 22, 'JACKPOT  +5', '#ffcf4a', 30);
        burst(p.x, p.y, 50, '#ffcf4a', 320, 1);
        shake = Math.max(shake, 10); flash = 0.4;
        sfx.jackpot();
      }
      if (perfect && combo % 5 === 0) startNova();
      score += gain; run.score = score;
      checkMilestones();
      if (perfect && navigator.vibrate) try { navigator.vibrate(combo % 5 === 0 ? 30 : 8); } catch {}
      const newSector = Math.floor(score / 15);
      if (newSector > sector) {
        sector = newSector; run.sector = sector + 1;
        addText(W / 2, camY + H * 0.32, 'SECTOR ' + (sector + 1), '#5ff2c4', 40, true);
        startModifier();
        sfx.sector();
      }
      if (!newBest && best > 0 && score > best) {
        newBest = true;
        addText(W / 2, camY + H * 0.4, 'NEW BEST!', '#ffcf4a', 36, true);
        sfx.best();
      }
      checkMissions();
    } else {
      sfx.land(0, false);
    }
  }

  function checkMilestones() {
    while (milestoneI < MILESTONES.length && score >= MILESTONES[milestoneI]) {
      const m = MILESTONES[milestoneI++];
      const v = addDust(Math.round(m / 5));
      banners.push({ title: `MILESTONE · ${m} POINTS`, sub: `+${v} ✦ stardust`, color: '#ffcf4a', t: 0 });
      sfx.best();
    }
  }

  // Wormholes throw you three planets ahead and pay for every planet you skipped.
  function warp(w) {
    w.used = true;
    const target = planets.find(q => q.idx === w.target);
    if (!target) return;
    burst(player.x, player.y, 50, '#c3a6ff', 320, 0.9);
    let skipped = 0;
    for (const q of planets) if (!q.visited && q.idx < target.idx && q.idx > player.planet.idx) { q.visited = true; skipped++; }
    target.visited = true;
    lastPlanet = target;
    player.mode = 'orbit'; player.planet = target;
    player.angle = Math.PI / 2; player.r = target.orbit * 1.8; player.dir = target.dir;
    placeOnOrbit();
    target.pulse = 1;
    hops += skipped + 1; run.hops = hops;
    runIdx = Math.max(runIdx, target.idx);
    const gain = skipped + 3;
    score += gain; run.score = score;
    addText(target.x, target.y - target.orbit - 24, `WARP  +${gain}`, '#c3a6ff', 34);
    burst(player.x, player.y, 50, '#c3a6ff', 320, 0.9);
    flash = 0.7; shake = 12;
    tone(180, 0.7, 'sine', 0.12, 1400); noise(0.5, 0.1, 3000);
    const newSector = Math.floor(score / 15);
    if (newSector > sector) { sector = newSector; run.sector = sector + 1; startModifier(); sfx.sector(); }
    checkMilestones();
    checkMissions();
  }

  function startNova() {
    novaT = perk.nova(); run.novas++;
    addText(W / 2, camY + H * 0.45, 'SUPERNOVA!', '#ffffff', 48, true);
    flash = 0.8; shake = 16;
    burst(player.x, player.y, 70, '#ffffff', 420, 1.2);
    sfx.nova();
  }

  function addDust(v) {
    if (doubleT > 0 || novaT > 0) v *= 2;
    if (state === 'play') { runDust += v; run.dust = runDust; }
    return v;
  }

  function grabPower(pu) {
    pu.taken = true; run.power++;
    const P = POWERS[pu.type];
    if (pu.type === 'shield') shield = true;
    if (pu.type === 'magnet') magnetT = P.dur * perk.dur();
    if (pu.type === 'double') doubleT = P.dur * perk.dur();
    if (pu.type === 'slow') slowT = P.dur * perk.dur();
    addText(pu.x, pu.y - 20, P.label, P.color, 26);
    burst(pu.x, pu.y, 30, P.color, 240, 0.7);
    sfx.power();
    checkMissions();
  }

  function trySave() {
    if (!shield || !lastPlanet || !planets.includes(lastPlanet)) return false;
    shield = false;
    burst(player.x, player.y, 30, '#7fb8ff', 250, 0.7);
    const p = lastPlanet;
    player.mode = 'orbit'; player.planet = p;
    player.angle = -Math.PI / 2; player.r = p.orbit * 1.6;
    placeOnOrbit();
    burst(player.x, player.y, 30, '#7fb8ff', 250, 0.7);
    addText(p.x, p.y - p.orbit - 30, 'SHIELD SAVED YOU', '#7fb8ff', 24);
    flash = 0.4; shake = 8;
    sfx.shield();
    return true;
  }

  function die() {
    if (trySave()) return;
    state = 'dead'; deadAt = time;
    shake = 14; flash = 0.4; slowmo = 0.25; novaT = 0;
    burst(player.x, player.y, 40, '#ff6b5b', 300, 1);
    burst(player.x, player.y, 25, skinColor(0.2), 200, 0.9);
    sfx.die();
    if (navigator.vibrate) try { navigator.vibrate(60); } catch {}
    runs++; store.set('runs', runs);
    rankBonus = Math.round(runDust * perk.dust());
    const before = skinIndexFor(dust);
    dust += runDust + missionDust + rankBonus; store.set('dust', dust);
    const after = skinIndexFor(dust);
    if (after > before) { unlockedNow = SKINS[after]; equip(after); setTimeout(() => sfx.unlock(), 500); }
    if (score > best) { best = score; store.set('best', best); newBest = true; }
    if (runIdx > bestIdx) { bestIdx = runIdx; store.set('bestIdx', bestIdx); }
    xpGain = score * 2 + runDust; xpBefore = xp; xp += xpGain; store.set('xp', xp);
    const nr = rankFor(xp);
    if (nr > rank) { rankedUp = nr; setTimeout(() => sfx.best(), 900); }
    rank = nr;
    crateP += score;
    if (crateP >= CRATE_AT) { crateP = Math.min(crateP - CRATE_AT, CRATE_AT - 1); crate = { state: 'closed', t: 0, tier: null }; }
    store.set('crate', crateP);
    // finished missions level up and get replaced for the next run
    deadMissions = missions.map((m, i) => ({ ...m, done: missionDone[i], progress: run[MISSION_TYPES[m.type].stat] }));
    missions = missions.map((m, i) => {
      if (!missionDone[i]) return m;
      mLevels[m.type] = (mLevels[m.type] || 0) + 1;
      return null;
    });
    missions = missions.map(m => m || newMission(missions.filter(Boolean).map(x => x.type).concat(deadMissions.map(x => x.type))));
    store.set('mlevels', mLevels); store.set('missions', missions);
  }
  let deadMissions = [];

  function openCrate() {
    let r = Math.random(), tier = CRATE_TIERS[0];
    for (const t of CRATE_TIERS) { if (r < t.chance) { tier = t; break; } r -= t.chance; }
    crate.state = 'open'; crate.t = 0; crate.tier = tier;
    const before = skinIndexFor(dust);
    dust += tier.dust; store.set('dust', dust);
    const after = skinIndexFor(dust);
    if (after > before) { unlockedNow = SKINS[after]; equip(after); setTimeout(() => sfx.unlock(), 700); }
    burst(W / 2, camY + H * 0.45, tier === CRATE_TIERS[0] ? 40 : 90, tier.color, 380, 1.2);
    flash = 0.6; shake = 10;
    sfx.jackpot();
  }

  // ---------- effects ----------
  function skinColor(t) {
    const s = SKINS[skinIdx];
    if (s.trail === 'rainbow' || novaT > 0) return `hsl(${(time * 200 + t * 300) % 360},100%,65%)`;
    return t < 0.5 ? s.trail[0] : s.trail[1];
  }
  function comboColor() { return ['#ffcf4a', '#5ff2c4', '#7fb8ff', '#ff7aa8', '#ffffff'][Math.min(Math.max(combo - 1, 0), 4)]; }
  function burst(x, y, n, color, speed, life) {
    if (reduceMotion) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * rand(0.2, 1);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rand(0.5, 1), max: life, color, size: rand(1.5, 3.5), drag: 0.92 });
    }
  }
  function ringWave(p) { particles.push({ ring: true, p, life: 0.5, max: 0.5, color: comboColor() }); }
  function addText(x, y, text, color, size, screen = false) { texts.push({ x, y, text, color, size, life: 1.1, max: 1.1, screen }); }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    if (state === 'dead') slowmo = Math.min(1, slowmo + dt * 0.6);
    const sdt = dt * slowmo;
    const wdt = sdt * (slowT > 0 ? 0.55 : 1);
    if (state === 'play') {
      magnetT = Math.max(0, magnetT - dt); doubleT = Math.max(0, doubleT - dt);
      slowT = Math.max(0, slowT - dt); novaT = Math.max(0, novaT - dt);
    }

    for (const p of planets) {
      if (p.amp) { p.mph += p.msp * wdt; p.x = p.baseX + Math.sin(p.mph) * p.amp; }
      p.pulse = Math.max(0, p.pulse - dt * 2);
      if (p.kind === 'pulsar') p.orbit = p.baseOrbit * (1 + 0.3 * Math.sin(time * 2.2 + p.mph));
    }

    if (state !== 'dead') {
      if (player.mode === 'orbit') {
        const p = player.planet;
        player.r = lerp(player.r, p.orbit, 1 - Math.pow(0.001, wdt));
        player.angle += player.dir * (p.lin * (modifier === 'hyper' ? 1.3 : 1) / p.orbit) * wdt;
        placeOnOrbit();
      } else {
        player.flyT += wdt;
        const steps = 2;
        for (let k = 0; k < steps && player.mode === 'fly' && state !== 'dead'; k++) {
          for (const h of holes) {
            const dx = h.x - player.x, dy = h.y - player.y, d = Math.hypot(dx, dy);
            if (d < 15 && state === 'play') { die(); break; }
            if (d < 180) {
              const a = Math.min(2200, 8.5e5 / (d * d));
              player.vx += dx / d * a * wdt / steps; player.vy += dy / d * a * wdt / steps;
            }
          }
          if (player.mode !== 'fly' || state === 'dead') break;
          player.x += player.vx * wdt / steps;
          player.y += player.vy * wdt / steps;
          for (const p of planets) {
            if (p === lastPlanet) continue;
            if (Math.hypot(player.x - p.x, player.y - p.y) < p.orbit) { capture(p); break; }
          }
        }
        if (state === 'play' && player.mode === 'fly' &&
          (player.x < -12 || player.x > W + 12 || player.y > camY + H + 30 || player.y < camY - 60 || player.flyT > 2.4)) die();
      }
      // trail
      const n = player.mode === 'fly' ? 3 : 1;
      for (let i = 0; i < n + (novaT > 0 ? 2 : 0); i++) {
        particles.push({
          x: player.x + rand(-2, 2), y: player.y + rand(-2, 2), vx: rand(-15, 15), vy: rand(-15, 15),
          life: player.mode === 'fly' ? 0.5 : 0.35, max: 0.5, color: skinColor(Math.random()), size: rand(2, 4.5) * (novaT > 0 ? 1.6 : 1), drag: 0.96, trail: true
        });
      }
      // asteroids only hurt while you're flying
      for (const a of asteroids) {
        if (a.dead || player.mode !== 'fly' || state !== 'play') continue;
        if (Math.hypot(player.x - a.x, player.y - a.y) < a.r + 5) {
          a.dead = true;
          burst(a.x, a.y, 24, '#c9a98f', 220, 0.7);
          if (novaT > 0) {
            const v = addDust(2);
            addText(a.x, a.y - 16, `SMASH +${v} ✦`, '#ffffff', 22);
            shake = Math.max(shake, 8); noise(0.25, 0.15, 400);
          } else if (shield) {
            shield = false;
            addText(a.x, a.y - 16, 'SHIELD BLOCKED', '#7fb8ff', 22);
            shake = Math.max(shake, 8); sfx.shield();
          } else { die(); break; }
        }
      }
      // stardust
      const pull = novaT > 0 ? 220 : magnetT > 0 ? perk.magnetR() : 0;
      for (const st of stars) {
        if (st.taken) continue;
        const dx = player.x - st.x, dy = player.y - st.y, dist = Math.hypot(dx, dy);
        if (pull && dist < pull && state === 'play') {
          st.x += dx / dist * 520 * wdt; st.y += dy / dist * 520 * wdt;
        }
        if (dist < 24) {
          st.taken = true;
          const v = addDust(st.gold ? 5 : 1);
          addText(st.x, st.y - 14, '+' + v + ' ✦', st.gold ? '#ffcf4a' : '#bfe9ff', st.gold ? 22 : 16);
          burst(st.x, st.y, st.gold ? 16 : 7, st.gold ? '#ffcf4a' : '#bfe9ff', 150, 0.45);
          sfx.star(st.gold);
          checkMissions();
        }
      }
      for (const pu of powers) {
        if (!pu.taken && state === 'play' && Math.hypot(player.x - pu.x, player.y - pu.y) < 28) grabPower(pu);
      }
      for (const w of portals) {
        if (!w.used && state === 'play' && player.mode === 'fly' && Math.hypot(player.x - w.x, player.y - w.y) < 26) { warp(w); break; }
      }
      // shooting stars streak across now and then; catch one for a big payout
      if (state === 'play' && hops > 0) {
        shootT -= dt;
        if (shootT <= 0) {
          shootT = rand(14, 24);
          const fromLeft = Math.random() < 0.5;
          shooters.push({ x: fromLeft ? -40 : W + 40, y: camY + H * rand(0.15, 0.45), vx: (fromLeft ? 1 : -1) * rand(150, 210), vy: rand(15, 45), done: false });
          tone(2400, 0.4, 'sine', 0.04, -1200);
        }
      }
      for (const s of shooters) {
        if (s.done || state !== 'play') continue;
        if (Math.hypot(player.x - s.x, player.y - s.y) < 30) {
          s.done = true;
          const v = addDust(15);
          addText(s.x, s.y - 18, `SHOOTING STAR +${v} ✦`, '#ffcf4a', 26);
          burst(s.x, s.y, 40, '#ffcf4a', 300, 0.9);
          flash = 0.4; sfx.jackpot();
          checkMissions();
        }
      }
    }

    // camera
    let target = player.planet.y - H * 0.68;
    if (state === 'title') target = player.planet.y - H * 0.6;
    if (player.mode === 'fly' && state === 'play') target = Math.min(target, player.y - H * 0.5);
    camY = lerp(camY, target, 1 - Math.pow(0.02, dt));

    // world upkeep
    while (planets[planets.length - 1].y > camY - H) spawnNext();
    planets = planets.filter(p => p.y < camY + H + 300 || p === player.planet || p === lastPlanet);
    stars = stars.filter(s => s.y < camY + H + 100 && !s.taken);
    powers = powers.filter(s => s.y < camY + H + 100 && !s.taken);
    for (const a of asteroids) {
      a.x += a.vx * wdt; a.rot += a.vr * wdt;
      if (a.x < -30) a.x = W + 30; else if (a.x > W + 30) a.x = -30;
    }
    asteroids = asteroids.filter(a => !a.dead && a.y < camY + H + 100);
    holes = holes.filter(h => h.y < camY + H + 200);
    portals = portals.filter(w => !w.used && w.y < camY + H + 100);
    for (const s of shooters) {
      s.x += s.vx * wdt; s.y += s.vy * wdt;
      if (!s.done && Math.random() < 0.6) particles.push({ x: s.x, y: s.y, vx: -s.vx * 0.1 + rand(-10, 10), vy: rand(-10, 10), life: 0.6, max: 0.6, color: '#ffe680', size: rand(1.5, 3.5), drag: 0.95, trail: true });
    }
    shooters = shooters.filter(s => !s.done && s.x > -60 && s.x < W + 60);
    if (crate) {
      crate.t += dt;
      if (crate.state === 'opening' && crate.t > 0.9) openCrate();
    }

    for (const p of particles) {
      p.life -= sdt;
      if (!p.ring) { p.x += p.vx * sdt; p.y += p.vy * sdt; p.vx *= Math.pow(p.drag, sdt * 60); p.vy *= Math.pow(p.drag, sdt * 60); }
    }
    particles = particles.filter(p => p.life > 0);
    for (const t of texts) { t.life -= dt; t.y -= dt * 30; }
    texts = texts.filter(t => t.life > 0);
    if (banners.length) { banners[0].t += dt; if (banners[0].t > 2.4) banners.shift(); }

    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt * 1.5);
    if (state === 'play') hintT += dt;
  }

  // ---------- draw ----------
  function drawBackground() {
    const depth = -camY / 3000;
    const hue = (195 + depth * 60) % 360;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, CH);
    const nv = novaT > 0 ? Math.min(1, novaT) * (0.5 + 0.5 * Math.sin(time * 8)) : 0;
    g.addColorStop(0, `hsl(${hue + 20 + nv * 60},${55 + nv * 30}%,${9 + nv * 8}%)`);
    g.addColorStop(1, `hsl(${hue},60%,4%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CW, CH);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const ny = ((i * 0.37 + (-camY * 0.03) / CH) % 1.4) * CH * 1.2 - CH * 0.2;
      const nx = CW * (0.2 + 0.6 * ((i * 0.61) % 1));
      const r = Math.max(CW, CH) * 0.45;
      const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, r);
      ng.addColorStop(0, `hsla(${(hue + 120 + i * 70) % 360},80%,45%,0.08)`);
      ng.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = ng; ctx.fillRect(0, 0, CW, CH);
    }
    ctx.restore();
    const streak = player && player.mode === 'fly' && state === 'play' ? 6 : 0;
    for (const s of bgStars) {
      let y = (s.y * CH - camY * scale * s.p) % CH; if (y < 0) y += CH;
      const a = 0.4 + 0.6 * Math.abs(Math.sin(time * 1.5 + s.tw));
      ctx.fillStyle = `rgba(244,239,225,${a * (0.3 + s.p)})`;
      ctx.fillRect(s.x * CW, y, s.r + s.p * 2, s.r + s.p * 2 + streak * s.p * 3);
    }
  }

  function drawPlanet(p) {
    const y = p.y;
    const isCur = p === player.planet;
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.lineDashOffset = -time * 20 * p.dir;
    ctx.strokeStyle = isCur ? 'rgba(244,239,225,0.35)' : p.visited ? 'rgba(244,239,225,0.08)' : p.kind === 'golden' ? 'rgba(255,207,74,0.6)' : 'rgba(95,242,196,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, y, p.orbit, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    if (!p.visited) {
      ctx.fillStyle = 'rgba(95,242,196,0.05)';
      ctx.beginPath(); ctx.arc(p.x, y, p.orbit * 0.42 + 6, 0, Math.PI * 2); ctx.fill();
    }
    if (p.pulse > 0) {
      ctx.strokeStyle = `rgba(244,239,225,${p.pulse * 0.6})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, y, p.orbit + (1 - p.pulse) * 20, 0, Math.PI * 2); ctx.stroke();
    }
    const glowR = p.body * (p.kind === 'golden' ? 3 + Math.sin(time * 4) * 0.3 : 2.2);
    const gl = ctx.createRadialGradient(p.x, y, p.body * 0.8, p.x, y, glowR);
    gl.addColorStop(0, p.pal[0] + (p.kind === 'golden' ? '70' : '40')); gl.addColorStop(1, p.pal[0] + '00');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(p.x, y, glowR, 0, Math.PI * 2); ctx.fill();
    if (p.ring) drawRing(p, y, true);
    const bg = ctx.createRadialGradient(p.x - p.body * 0.4, y - p.body * 0.4, p.body * 0.1, p.x, y, p.body);
    bg.addColorStop(0, p.pal[0]); bg.addColorStop(1, p.pal[1]);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(p.x, y, p.body, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    for (const c of p.craters) {
      ctx.beginPath();
      ctx.arc(p.x + Math.cos(c.a) * c.r * p.body, y + Math.sin(c.a) * c.r * p.body, c.s * p.body, 0, Math.PI * 2);
      ctx.fill();
    }
    const sh = ctx.createLinearGradient(p.x - p.body, y - p.body, p.x + p.body, y + p.body);
    sh.addColorStop(0.5, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(p.x, y, p.body, 0, Math.PI * 2); ctx.fill();
    if (p.ring) drawRing(p, y, false);
    if (p.kind === 'pulsar') {
      ctx.save(); ctx.translate(p.x, y); ctx.rotate(time * 1.5);
      const bg2 = ctx.createLinearGradient(0, -p.body * 3, 0, p.body * 3);
      bg2.addColorStop(0, 'rgba(160,210,255,0)'); bg2.addColorStop(0.5, 'rgba(160,210,255,0.35)'); bg2.addColorStop(1, 'rgba(160,210,255,0)');
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-10, -p.body * 3); ctx.lineTo(10, -p.body * 3); ctx.lineTo(3, 0);
      ctx.lineTo(10, p.body * 3); ctx.lineTo(-10, p.body * 3); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (p.kind === 'golden' && !p.visited) {
      ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 6);
      ctx.font = `14px ${FN}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffcf4a';
      ctx.fillText('+5', p.x, y + 5);
      ctx.restore();
    }
  }
  function drawRing(p, y, back) {
    ctx.save();
    ctx.translate(p.x, y); ctx.rotate(p.ringTilt);
    ctx.strokeStyle = p.pal[0] + 'aa'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.body * 1.7, p.body * 0.45, 0, back ? Math.PI : 0, back ? Math.PI * 2 : Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  function drawStar(s) {
    const r = s.gold ? 9 : 6;
    const pulse = 1 + Math.sin(time * 5 + s.ph) * 0.15;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(time * (s.gold ? 2 : 1) + s.ph); ctx.scale(pulse, pulse);
    ctx.fillStyle = s.gold ? '#ffcf4a' : '#bfe9ff';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2, rr = i % 2 ? r * 0.38 : r;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function powerIcon(type, x, y, r) {
    const c = POWERS[type].color;
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = r * 0.18; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (type === 'shield') {
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.6); ctx.lineTo(r * 0.5, -r * 0.4); ctx.lineTo(r * 0.45, r * 0.1);
      ctx.quadraticCurveTo(r * 0.3, r * 0.5, 0, r * 0.65); ctx.quadraticCurveTo(-r * 0.3, r * 0.5, -r * 0.45, r * 0.1);
      ctx.lineTo(-r * 0.5, -r * 0.4); ctx.closePath(); ctx.fill();
    } else if (type === 'magnet') {
      ctx.lineWidth = r * 0.28;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.38, Math.PI, 0, true); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * 0.38, 0); ctx.lineTo(-r * 0.38, -r * 0.45); ctx.moveTo(r * 0.38, 0); ctx.lineTo(r * 0.38, -r * 0.45); ctx.stroke();
      ctx.strokeStyle = '#f4efe1';
      ctx.beginPath(); ctx.moveTo(-r * 0.38, -r * 0.35); ctx.lineTo(-r * 0.38, -r * 0.5); ctx.moveTo(r * 0.38, -r * 0.35); ctx.lineTo(r * 0.38, -r * 0.5); ctx.stroke();
    } else if (type === 'double') {
      ctx.font = `${r * 0.95}px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('2X', 0, r * 0.05);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -r * 0.32); ctx.moveTo(0, 0); ctx.lineTo(r * 0.22, r * 0.12); ctx.stroke();
    }
    ctx.restore();
  }

  function drawPower(pu) {
    const c = POWERS[pu.type].color;
    const bob = Math.sin(time * 3 + pu.ph) * 4;
    const y = pu.y + bob;
    ctx.save();
    ctx.shadowColor = c; ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(5,15,20,0.85)'; ctx.strokeStyle = c; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(pu.x, y, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = c; ctx.globalAlpha = 0.4; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(pu.x, y, 22 + Math.sin(time * 5) * 2, time * 2, time * 2 + 4); ctx.stroke();
    ctx.restore();
    powerIcon(pu.type, pu.x, y, 17);
  }

  function drawPortal(w) {
    ctx.save();
    ctx.translate(w.x, w.y);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
    g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.35, 'rgba(195,166,255,0.6)'); g.addColorStop(1, 'rgba(95,242,196,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const s = -time * 4 + w.ph + i * Math.PI / 2;
      ctx.strokeStyle = i % 2 ? '#5ff2c4' : '#c3a6ff';
      ctx.beginPath(); ctx.arc(0, 0, 12 + i * 3, s, s + 1.4); ctx.stroke();
    }
    ctx.restore();
    text('WARP', w.x, w.y + 34, 11, '#c3a6ff', FN, 'center', true);
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    const g = ctx.createRadialGradient(-a.r * 0.3, -a.r * 0.3, 1, 0, 0, a.r);
    g.addColorStop(0, '#b39a88'); g.addColorStop(1, '#4a3a33');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(255,138,91,0.5)'; ctx.shadowBlur = 10;
    ctx.beginPath();
    a.pts.forEach((k, i) => { const an = (i / a.pts.length) * Math.PI * 2; ctx.lineTo(Math.cos(an) * a.r * k, Math.sin(an) * a.r * k); });
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(a.r * 0.25, a.r * 0.1, a.r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawHole(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 70);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.25, 'rgba(20,0,40,0.9)'); g.addColorStop(1, 'rgba(157,107,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 2); ctx.fill();
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = `rgba(195,166,255,${0.5 - i * 0.12})`; ctx.lineWidth = 3 - i * 0.7;
      const r = 22 + i * 12, s = time * (3 - i) + h.ph + i;
      ctx.beginPath(); ctx.arc(0, 0, r, s, s + 2.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r, s + Math.PI, s + Math.PI + 1.6); ctx.stroke();
    }
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c3a6ff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.setLineDash([2, 10]); ctx.strokeStyle = 'rgba(195,166,255,0.15)'; ctx.lineDashOffset = time * 20;
    ctx.beginPath(); ctx.arc(0, 0, 180, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawComet(x, y, sk, size = 7) {
    const s = SKINS[sk];
    ctx.save();
    ctx.shadowColor = s.trail === 'rainbow' || novaT > 0 ? `hsl(${time * 200 % 360},100%,65%)` : s.trail[0];
    ctx.shadowBlur = novaT > 0 ? 35 : 20;
    ctx.fillStyle = s.head;
    ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawWorld() {
    ctx.save();
    const sx = (Math.random() - 0.5) * shake * (reduceMotion ? 0.2 : 1);
    const sy = (Math.random() - 0.5) * shake * (reduceMotion ? 0.2 : 1);
    ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * (offX + sx * scale), DPR * (-camY * scale + sy * scale));

    ctx.fillStyle = 'rgba(255,107,91,0.05)';
    ctx.fillRect(-400, camY - 10, 400, H + 20);
    ctx.fillRect(W, camY - 10, 400, H + 20);
    ctx.strokeStyle = 'rgba(255,107,91,0.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, camY); ctx.lineTo(0, camY + H); ctx.moveTo(W, camY); ctx.lineTo(W, camY + H); ctx.stroke();

    // where your best run ended
    if (bestIdx > 3 && runIdx < bestIdx && state !== 'title') {
      const bp = planets.find(p => p.idx === bestIdx);
      if (bp) {
        const ly = bp.y - bp.orbit - 24;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,207,74,0.45)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]); ctx.lineDashOffset = -time * 20;
        ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
        ctx.restore();
        text('YOUR BEST', 10, ly - 12, 13, '#ffcf4a', FN, 'left', true);
      }
    }
    for (const h of holes) drawHole(h);
    for (const p of planets) drawPlanet(p);
    for (const a of asteroids) drawAsteroid(a);
    for (const s of stars) if (!s.taken) drawStar(s);
    for (const pu of powers) if (!pu.taken) drawPower(pu);
    for (const w of portals) drawPortal(w);
    for (const s of shooters) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(time * 4);
      ctx.fillStyle = '#fff6c2'; ctx.shadowColor = '#ffcf4a'; ctx.shadowBlur = 24;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = i % 2 ? 4.5 : 11; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const a = p.life / p.max;
      if (p.ring) {
        ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = 4 * a;
        ctx.beginPath(); ctx.arc(p.p.x, p.p.y, p.p.orbit * (1 + (1 - a) * 0.8), 0, Math.PI * 2); ctx.stroke();
        continue;
      }
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.trail ? a : 1), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (state !== 'dead') {
      if (player.mode === 'orbit' && hops < 4) {
        const a = player.angle, d = player.dir;
        const tx = -Math.sin(a) * d, ty = Math.cos(a) * d;
        const g = ctx.createLinearGradient(player.x, player.y, player.x + tx * 140, player.y + ty * 140);
        g.addColorStop(0, 'rgba(244,239,225,0.45)'); g.addColorStop(1, 'rgba(244,239,225,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.setLineDash([3, 6]);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + tx * 140, player.y + ty * 140); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (magnetT > 0 || novaT > 0) {
        ctx.strokeStyle = novaT > 0 ? 'rgba(255,255,255,0.12)' : 'rgba(255,107,91,0.15)';
        ctx.lineWidth = 1; ctx.setLineDash([2, 10]); ctx.lineDashOffset = time * 30;
        ctx.beginPath(); ctx.arc(player.x, player.y, novaT > 0 ? 220 : 150, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
      drawComet(player.x, player.y, skinIdx, novaT > 0 ? 10 : combo >= 3 ? 8.5 : 7);
      if (shield) {
        ctx.strokeStyle = `rgba(127,184,255,${0.6 + 0.3 * Math.sin(time * 6)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(player.x, player.y, 14, 0, Math.PI * 2); ctx.stroke();
      }
    }

    for (const t of texts) if (!t.screen) drawPop(t);
    ctx.restore();
  }

  function drawPop(t) {
    const a = Math.min(1, t.life / t.max * 2);
    const age = 1 - t.life / t.max;
    const sc = age < 0.15 ? 0.6 + age / 0.15 * 0.6 : 1.2 - Math.min(0.2, (age - 0.15));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(t.x, t.y); ctx.scale(sc, sc);
    ctx.font = `${t.size}px ${FD}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(5,15,20,0.8)'; ctx.lineJoin = 'round';
    ctx.strokeText(t.text, 0, 0);
    ctx.fillStyle = t.color; ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }

  // UI is drawn in "ui space": logical units, origin top-left of the play column.
  function ui() { ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * offX, 0); }
  function text(str, x, y, size, color, font = FD, align = 'center', stroke = true) {
    ctx.font = `${size}px ${font}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (stroke) { ctx.lineWidth = Math.max(3, size / 7); ctx.strokeStyle = 'rgba(5,15,20,0.85)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function fitText(str, x, y, size, color, font, maxW, align = 'center', stroke = false) {
    ctx.font = `${size}px ${font}`;
    const w = ctx.measureText(str).width;
    text(str, x, y, w > maxW ? size * maxW / w : size, color, font, align, stroke);
  }
  function safeTop() { return (parseFloat(getComputedStyle(muteBtn).top) || 12) / scale; }

  function drawHUD() {
    ui();
    const top = safeTop() + 6;
    if (state === 'play') {
      const bounce = combo > 0 ? 1 + Math.max(0, flash) * 0.8 : 1;
      ctx.save(); ctx.translate(W / 2, top + 30); ctx.scale(bounce, bounce);
      text(String(score), 0, 0, 56, '#f4efe1');
      ctx.restore();
      if (novaT > 0) text('SUPERNOVA  ' + Math.ceil(novaT), W / 2, top + 72, 18, `hsl(${time * 300 % 360},100%,75%)`, FN);
      else if (combo > 0) text('COMBO x' + (1 + Math.min(combo, 4)), W / 2, top + 72, 18, comboColor(), FN);
      if (modifier) text(MODS[modifier].name, W / 2, top + 94, 12, MODS[modifier].color, FN, 'center', false);
      text('✦ ' + runDust, W - 16, top + 14, 20, (doubleT > 0 || novaT > 0) ? '#ffcf4a' : '#bfe9ff', FN, 'right');
      if (best > 0) text('BEST ' + best, W - 16, top + 40, 14, 'rgba(244,239,225,0.55)', FN, 'right', false);
      // active power-ups
      let px = 26;
      const py = top + 66;
      const active = [['shield', shield ? 1 : 0, 0], ['magnet', magnetT, 9 * perk.dur()], ['double', doubleT, 10 * perk.dur()], ['slow', slowT, 6 * perk.dur()]];
      for (const [type, v, dur] of active) {
        if (!v) continue;
        ctx.fillStyle = 'rgba(5,15,20,0.7)';
        ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.fill();
        if (dur) {
          ctx.strokeStyle = POWERS[type].color; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(px, py, 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (v / dur)); ctx.stroke();
        }
        powerIcon(type, px, py, 13);
        px += 34;
      }
      if (hops === 0 && hintT > 0.3) {
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 5);
        text('TAP to launch', W / 2, H * 0.86, 24, '#f4efe1');
        text('aim through the middle of the next orbit for a PERFECT', W / 2, H * 0.86 + 30, 13, '#5ff2c4', FN);
        ctx.globalAlpha = 1;
      }
      if (banners.length) drawBanner(banners[0], top + 132);
    }
    for (const t of texts) if (t.screen) drawPop({ ...t, y: t.y - camY });
  }

  function drawBanner(b, y) {
    const inT = clamp(b.t / 0.25, 0, 1), outT = clamp((b.t - 2.1) / 0.3, 0, 1);
    const k = (1 - Math.pow(1 - inT, 3)) * (1 - outT);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.translate(W / 2, y - (1 - k) * 20);
    ctx.fillStyle = 'rgba(5,15,20,0.85)'; ctx.strokeStyle = b.color; ctx.lineWidth = 2;
    roundRect(-180, -26, 360, 52, 12); ctx.fill(); ctx.stroke();
    text(b.title, 0, -9, 18, b.color, FD, 'center', false);
    fitText(b.sub, 0, 12, 13, '#f4efe1', FN, 340);
    ctx.restore();
  }

  function drawMissions(y, list, showReward) {
    const x0 = 34, w = W - 68;
    text('MISSIONS', W / 2, y, 14, 'rgba(244,239,225,0.55)', FN, 'center', false);
    list.forEach((m, i) => {
      const ry = y + 26 + i * 34;
      const done = m.done;
      ctx.fillStyle = done ? 'rgba(95,242,196,0.14)' : 'rgba(244,239,225,0.06)';
      roundRect(x0, ry - 14, w, 28, 8); ctx.fill();
      if (m.progress != null && !done) {
        ctx.fillStyle = 'rgba(95,242,196,0.16)';
        roundRect(x0, ry - 14, Math.max(16, w * clamp(m.progress / m.target, 0, 1)), 28, 8); ctx.fill();
      }
      text(done ? '✓' : '○', x0 + 16, ry + 1, 15, done ? '#5ff2c4' : 'rgba(244,239,225,0.5)', FN, 'center', false);
      fitText(missionDesc(m), x0 + 32, ry + 1, 14, done ? '#5ff2c4' : '#f4efe1', FN, w - 110, 'left');
      const right = m.progress != null && !done ? `${Math.min(m.progress, m.target)}/${m.target}` : `+${missionReward(m)} ✦`;
      text(right, x0 + w - 10, ry + 1, 13, done ? '#5ff2c4' : showReward ? '#bfe9ff' : 'rgba(244,239,225,0.6)', FN, 'right', false);
    });
  }

  function drawTitle() {
    ui();
    const cy = H * 0.2;
    const bob = Math.sin(time * 2) * 4;
    ctx.save();
    ctx.translate(W / 2, cy + bob); ctx.rotate(-0.06);
    text('COMET', 0, -34, 78, '#ffcf4a');
    text('HOP', 30, 36, 78, '#ff6b5b');
    ctx.restore();
    text('one tap · hop planet to planet · don’t drift away', W / 2, cy + 100, 14, 'rgba(244,239,225,0.75)', FN, 'center', false);

    const my = Math.max(cy + 140, H * 0.42);
    ctx.fillStyle = 'rgba(5,15,20,0.55)';
    roundRect(22, my - 22, W - 44, 140, 14); ctx.fill();
    drawMissions(my, missions, true);

    if (gift) {
      const gy = my + 150;
      const s = 1 + Math.sin(time * 4) * 0.03;
      ctx.save(); ctx.translate(W / 2, gy); ctx.scale(s, s);
      ctx.fillStyle = 'rgba(255,207,74,0.12)'; ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 2;
      roundRect(-150, -22, 300, 44, 12); ctx.fill(); ctx.stroke();
      text(`DAILY GIFT  +${gift.amount} ✦`, 0, -6, 18, '#ffcf4a', FD, 'center', false);
      text(gift.streak > 1 ? `${gift.streak}-day streak · come back tomorrow for more` : 'come back tomorrow for a bigger one', 0, 12, 11, 'rgba(244,239,225,0.75)', FN, 'center', false);
      ctx.restore();
    }

    drawCollection(H - 140);

    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 4);
    text('TAP TO PLAY', W / 2, H - 80, 32, '#f4efe1');
    ctx.globalAlpha = 1;
    statLine(H - 42);
  }

  // Comet hangar: every comet in a row, tap an unlocked one to fly it.
  const COLL_GAP = 36;
  const collX = i => W / 2 + (i - (SKINS.length - 1) / 2) * COLL_GAP;
  function drawCollection(y) {
    const owned = skinIndexFor(dust) + 1;
    text(`COMETS ${owned}/${SKINS.length}  ·  tap one to fly it`, W / 2, y - 26, 12, 'rgba(244,239,225,0.55)', FN, 'center', false);
    SKINS.forEach((s, i) => {
      const x = collX(i);
      if (i < owned) {
        if (i === skinIdx) {
          ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x, y, 14 + Math.sin(time * 4) * 1.5, 0, Math.PI * 2); ctx.stroke();
        }
        drawComet(x, y, i, i === skinIdx ? 7 : 6);
      } else {
        ctx.strokeStyle = 'rgba(244,239,225,0.2)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.stroke();
        text('?', x, y + 1, 10, 'rgba(244,239,225,0.3)', FN, 'center', false);
      }
    });
  }
  function collectionHit(ux, uy) {
    const y = H - 140;
    if (Math.abs(uy - y) > 20) return -1;
    for (let i = 0; i < SKINS.length; i++) if (Math.abs(ux - collX(i)) < COLL_GAP / 2) return i;
    return -1;
  }

  function statLine(y) {
    const parts = [RANKS[rank].name.toUpperCase(), `BEST ${best}`, `✦ ${dust}`, SKINS[skinIdx].name.toUpperCase()];
    fitText(parts.join('  ·  '), W / 2, y, 14, 'rgba(244,239,225,0.6)', FN, W - 30);
  }

  function drawDead() {
    ui();
    const t = Math.min(1, (time - deadAt) / 0.5);
    const ease = 1 - Math.pow(1 - t, 3);
    ctx.fillStyle = `rgba(5,15,20,${0.7 * ease})`;
    ctx.fillRect(-offX / scale, 0, CW / scale, H);

    const blockH = 530;
    let y = Math.max(safeTop() + 40, (H - blockH) / 2 - 10) + (1 - ease) * 30;
    ctx.globalAlpha = ease;
    text(['LOST IN SPACE', 'DRIFTED OFF', 'SPAGHETTIFIED', 'SO CLOSE'][(runs + score) % 4], W / 2, y, 30, '#ff6b5b');
    y += 62;
    text(String(score), W / 2, y, 84, '#f4efe1');
    y += 56;
    if (newBest) {
      const s = 1 + Math.sin(time * 6) * 0.05;
      ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s); text('★ NEW BEST ★', 0, 0, 24, '#ffcf4a'); ctx.restore();
    } else {
      text('BEST ' + best, W / 2, y, 18, 'rgba(244,239,225,0.6)', FN);
    }
    y += 40;
    fitText(`+${runDust} ✦ stardust` + (missionDust ? `   +${missionDust} missions` : '') + (rankBonus ? `   +${rankBonus} rank` : ''), W / 2, y, 17, '#bfe9ff', FN, W - 30);
    y += 34;

    // pilot rank
    if (rankedUp) {
      const s = 1 + Math.sin(time * 5) * 0.03;
      ctx.save(); ctx.translate(W / 2, y + 8); ctx.scale(s, s);
      ctx.fillStyle = 'rgba(95,242,196,0.12)'; ctx.strokeStyle = '#5ff2c4'; ctx.lineWidth = 2;
      roundRect(-160, -22, 320, 44, 12); ctx.fill(); ctx.stroke();
      text(`RANK UP · ${RANKS[rankedUp].name.toUpperCase()}`, 0, -7, 17, '#5ff2c4', FD, 'center', false);
      fitText(RANKS[rankedUp].perk, 0, 12, 12, '#f4efe1', FN, 300);
      ctx.restore();
    } else {
      const nextR = RANKS[rank + 1];
      text(`${RANKS[rank].name.toUpperCase()}  ·  +${xpGain} XP`, W / 2, y, 13, 'rgba(244,239,225,0.75)', FN, 'center', false);
      if (nextR) {
        const bw = 200, bx = W / 2 - bw / 2;
        const span = nextR.at - RANKS[rank].at;
        const fillT = clamp((time - deadAt - 0.4) / 0.8, 0, 1);
        const f = clamp((lerp(xpBefore, xp, 1 - Math.pow(1 - fillT, 3)) - RANKS[rank].at) / span, 0, 1);
        ctx.fillStyle = 'rgba(244,239,225,0.12)'; roundRect(bx, y + 11, bw, 6, 3); ctx.fill();
        ctx.fillStyle = '#5ff2c4'; roundRect(bx, y + 11, Math.max(6, bw * f), 6, 3); ctx.fill();
        text(`${nextR.at - xp} XP to ${nextR.name}`, W / 2, y + 28, 11, 'rgba(244,239,225,0.5)', FN, 'center', false);
      }
    }
    y += 52;

    if (unlockedNow) {
      const ut = clamp((time - deadAt - 0.5) / 0.4, 0, 1);
      ctx.save();
      ctx.translate(W / 2, y + 24); const s = 0.5 + 0.5 * (1 - Math.pow(1 - ut, 3)) + Math.sin(time * 4) * 0.02; ctx.scale(s, s);
      ctx.globalAlpha = ut * ease;
      ctx.fillStyle = 'rgba(255,207,74,0.12)'; ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 2;
      roundRect(-150, -30, 300, 60, 16); ctx.fill(); ctx.stroke();
      text('NEW COMET UNLOCKED', 18, -10, 14, '#ffcf4a', FN, 'center', false);
      text(unlockedNow.name, 18, 13, 24, '#f4efe1');
      drawComet(-118, 0, SKINS.indexOf(unlockedNow), 10);
      ctx.restore();
      ctx.globalAlpha = ease;
    } else {
      const next = SKINS[skinIndexFor(dust) + 1];
      const bw = 260, bx = W / 2 - bw / 2, bh = 12;
      if (next) {
        const prevAt = SKINS[skinIndexFor(dust)].at;
        const gained = runDust + missionDust;
        const before = clamp((dust - gained - prevAt) / (next.at - prevAt), 0, 1);
        const now = clamp((dust - prevAt) / (next.at - prevAt), 0, 1);
        const fillT = clamp((time - deadAt - 0.6) / 0.8, 0, 1);
        const f = lerp(before, now, 1 - Math.pow(1 - fillT, 3));
        ctx.fillStyle = 'rgba(244,239,225,0.12)';
        roundRect(bx, y + 4, bw, bh, 6); ctx.fill();
        const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
        g.addColorStop(0, '#5ff2c4'); g.addColorStop(1, '#ffcf4a');
        ctx.fillStyle = g; roundRect(bx, y + 4, Math.max(bh, bw * f), bh, 6); ctx.fill();
        text(`${next.at - dust} ✦ to unlock ${next.name}`, W / 2, y + 34, 13, 'rgba(244,239,225,0.7)', FN, 'center', false);
      } else {
        text('every comet unlocked. legend.', W / 2, y + 20, 14, '#ffcf4a', FN, 'center', false);
      }
    }
    y += 76;
    drawMissions(y, deadMissions, false);
    text(`next Cosmic Crate in ${CRATE_AT - crateP} points`, W / 2, y + 140, 12, 'rgba(195,166,255,0.8)', FN, 'center', false);

    if (time - deadAt > 0.7 && !crate) {
      ctx.globalAlpha = (0.55 + 0.45 * Math.sin(time * 4)) * ease;
      text('TAP TO RETRY', W / 2, Math.max(y + 180, H - 44), 30, '#f4efe1');
    }
    ctx.globalAlpha = 1;
    if (crate) drawCrate();
  }

  function drawCrate() {
    const k = crate.state === 'closed' ? clamp((time - deadAt - 0.9) / 0.3, 0, 1) : 1;
    if (!k) return;
    ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(5,15,20,0.94)';
    ctx.fillRect(-offX / scale, 0, CW / scale, H);
    const cy = H * 0.45;
    if (crate.state !== 'open') {
      const opening = crate.state === 'opening';
      const wob = opening ? Math.sin(crate.t * 70) * 0.18 * crate.t : Math.sin(time * 5) * 0.06;
      const s = (opening ? 1 + crate.t * 0.35 : 1 + Math.sin(time * 3) * 0.03) * (0.6 + 0.4 * k);
      text('COSMIC CRATE', W / 2, cy - 120, 34, '#c3a6ff');
      ctx.save(); ctx.translate(W / 2, cy); ctx.rotate(wob); ctx.scale(s, s);
      ctx.shadowColor = '#c3a6ff'; ctx.shadowBlur = 30 + (opening ? crate.t * 60 : 0);
      const g = ctx.createLinearGradient(0, -55, 0, 55);
      g.addColorStop(0, '#6b4bd6'); g.addColorStop(1, '#2a1a73');
      ctx.fillStyle = g; roundRect(-55, -50, 110, 100, 14); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffcf4a'; ctx.fillRect(-55, -22, 110, 10); ctx.fillRect(-7, -50, 14, 100);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; roundRect(-55, -50, 110, 100, 14); ctx.stroke();
      text('?', 0, 18, 36, '#f4efe1');
      ctx.restore();
      if (!opening) {
        ctx.globalAlpha = k * (0.55 + 0.45 * Math.sin(time * 4));
        text('TAP TO OPEN', W / 2, cy + 110, 26, '#f4efe1');
      }
    } else {
      const t = crate.tier, e = 1 - Math.pow(1 - clamp(crate.t / 0.4, 0, 1), 3);
      ctx.save(); ctx.translate(W / 2, cy); ctx.rotate(time * 0.6);
      ctx.fillStyle = t.color; ctx.globalAlpha = 0.12;
      for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI / 6);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, -260); ctx.lineTo(18, -260); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(W / 2, cy); ctx.scale(0.5 + 0.5 * e, 0.5 + 0.5 * e);
      text(t.name, 0, -60, 30, t.color);
      text(`+${t.dust} ✦`, 0, 10, 72, '#f4efe1');
      text('stardust', 0, 60, 16, '#bfe9ff', FN, 'center', false);
      ctx.restore();
      if (crate.t > 0.6) {
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 4);
        text('TAP TO CONTINUE', W / 2, cy + 130, 22, '#f4efe1');
      }
    }
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw() {
    drawBackground();
    drawWorld();
    if (state === 'title') drawTitle();
    drawHUD();
    if (state === 'dead') drawDead();
    if (flash > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = `rgba(244,239,225,${flash * 0.25})`;
      ctx.fillRect(0, 0, CW * DPR, CH * DPR);
    }
  }

  // ---------- input ----------
  function press() {
    audio();
    if (state === 'title') { state = 'play'; hintT = 0; gift = null; return; }
    if (state === 'play') { launch(); return; }
    if (state === 'dead' && time - deadAt > 0.7) {
      if (crate) {
        if (crate.state === 'closed' && time - deadAt > 1.1) { crate.state = 'opening'; crate.t = 0; tone(200, 0.9, 'sawtooth', 0.05, 600); }
        else if (crate.state === 'open' && crate.t > 0.6) crate = null;
        return;
      }
      reset(); state = 'play';
    }
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.focus();
    if (state === 'title') {
      const r = cv.getBoundingClientRect();
      const hit = collectionHit((e.clientX - r.left - offX) / scale, (e.clientY - r.top) / scale);
      if (hit >= 0) {
        audio();
        if (hit <= skinIndexFor(dust)) { equip(hit); burst(player.x, player.y, 20, skinColor(0.3), 160, 0.5); tone(880, 0.15, 'triangle', 0.08); }
        else tone(160, 0.15, 'square', 0.05);
        return;
      }
    }
    press();
  });
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { e.preventDefault(); press(); }
    if (e.code === 'KeyM') { audio(); setMuted(!muted); }
  });

  // ---------- loop ----------
  reset();
  let last = performance.now(), acc = 0;
  const STEP = 1 / 120;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw();
    musicTick();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) { document.fonts.load(`40px ${FD}`); document.fonts.load(`20px ${FN}`); }
})();
</script>
